name: Refresh opportunities feed

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/feed.mjs']

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/feed.mjs
      - name: Commit feed
        run: |
          git config user.name "ark-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Refresh feed"
          git push
