name: Fetch app assets

on:
  push:
    paths: ['assets/fetch.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download listed files
        run: |
          while read -r url name; do
            [ -z "$url" ] && continue
            curl -fsSL -A "Mozilla/5.0" "$url" -o "assets/$name"
            ls -l "assets/$name"
          done < assets/fetch.txt
      - name: Commit
        run: |
          git config user.name "ark-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Fetch assets"
          git pull --rebase
          git push
